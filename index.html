<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formatador de Lista</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#16211b;--mute:#5d6b63;--line:#d3dad5;--acc:#0f6b46;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--ink:#e9efea;--mute:#9aa9a0;--line:#2a372f;--acc:#3ecf8e;--accink:#05140c}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--ink:#e9efea;--mute:#9aa9a0;--line:#2a372f;--acc:#3ecf8e;--accink:#05140c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.8rem;line-height:1.1;margin:8px 0 16px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:1rem;margin:0 0 8px}
textarea{width:100%;height:340px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font-family:ui-monospace,Consolas,monospace;font-size:15px;line-height:1.6}
textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:700}
.bar input{width:20px;height:20px;accent-color:var(--acc)}
button{font-family:inherit;font-size:.95rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.sp{flex:1}
.info{color:var(--mute);font-size:.9rem;margin-top:8px;min-height:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<h1>Formatador de Lista</h1>
<div class="bar">
<label><input type="checkbox" id="short"> Short</label>
<span class="sp"></span>
<button id="fmt">Formatar</button>
<button id="clr">Limpar</button>
<button class="p" id="cp">Copiar resultado</button>
</div>
<div class="grid">
<div class="card"><h2>Cole a lista aqui</h2><textarea id="in" spellcheck="false" placeholder="joão 10 G&#10;maria 12 M&#10;gustavo 7 GG"></textarea></div>
<div class="card"><h2>Resultado</h2><textarea id="out" readonly spellcheck="false"></textarea><div class="info" id="info"></div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
/*CORE*/
var SIZE=/^(A\d{1,2}|ESPECIAL|ESP|XXXG|XXG|XG|EXGG|EXG|XGG|GGG|GG|G|M|P|PP|XXS|XS|S|L|XL|XXL|XXXL|G1|G2|G3|G4)$/i;
var NUM=/^(?:n[º°o]\.?|#)?(\d{1,3})$/i;
function clean(s){
  return String(s).normalize('NFC')
    .replace(/[\u200B-\u200D\u2060\uFEFF\u00AD]/g,'')
    .replace(/[\u00A0\u2007\u202F]/g,' ')
    .replace(/\r/g,'');
}
var SIZE_LAB=/(^|[^\p{L}\p{N}])(?:TAMANHO|TAM|TM)\.?\s*[:=]?\s*(?:([\p{L}\p{N}]{1,5})(?![\p{L}\p{N}])(?!\s*[:=]))?/giu;
var NUM_LAB=/(^|[^\p{L}\p{N}])(?:(?:NUMERO|NÚMERO|NUM|NRO|N)\.?\s*[:=]|N[º°]\.?|NUM(?:ERO)?\.?|NÚMERO)\s*(\d{1,4})?(?![\p{L}\p{N}])/giu;
var EDGE=/^[\s\-–—\/,;:|]+|[\s\-–—\/,;:|]+$/g;
function formatLine(raw,short){
  var line=clean(raw).trim();
  if(!line)return null;
  line=line.replace(/[*_~]/g,'').replace(/^[\s•·▪►>\-–—]+/,'');
  line=line.replace(/^\d{1,3}\s*[.)]\s+/,'');
  line=line.replace(/(\p{L})-(\d)/gu,'$1 $2').replace(/(\d)-(\p{L})/gu,'$1 $2');
  // idade: "4 anos", "8anos", "6a" -> A4, A8, A6
  line=line.replace(/(^|[^\p{L}\p{N}])(\d{1,2})\s*anos?(?![\p{L}\p{N}])/giu,'$1A$2 ');
  line=line.replace(/(^|[^\p{L}\p{N}])(\d{1,2})a(?![\p{L}\p{N}])/giu,'$1A$2 ');
  var num='',size='';
  // número com #: "#078", "#2324"
  line=line.replace(/#\s*(\d{1,4})(?!\d)/g,function(m,d){if(!num)num=d;return ' ';});
  // parênteses/colchetes com tamanho ou número: "(G)", "(A10 )", "(12)" -> tira os parênteses
  line=line.replace(/[(\[]\s*([^()\[\]]*?)\s*[)\]]/g,function(m,c){
    if(SIZE.test(c)||/^\d{1,3}$/.test(c))return ' '+c+' ';
    return m;
  });
  // 1) campos com rótulo: "TM: M", "N: 15", "Nº 9"
  line=line.replace(SIZE_LAB,function(m,pre,val){
    if(val&&(SIZE.test(val)||/^\d{1,2}$/.test(val))){if(!size)size=/^\d/.test(val)?'A'+val:val;return pre+' ';}
    return pre+' '+(val||'')+' ';
  });
  line=line.replace(NUM_LAB,function(m,pre,d){if(d&&!num)num=d;return pre+' ';});
  // 2) o que sobrou: procura número/tamanho soltos só se ainda faltar
  var toks=line.split(/[\s,;|\/:=]+/).filter(function(t){return t&&!/^[-–—:]+$/.test(t)});
  var numI=-1,sizeI=-1,i;
  if(!num){for(i=0;i<toks.length;i++){if(/^\d{1,3}$/.test(toks[i])){numI=i;break}}}
  if(!size){for(i=toks.length-1;i>=0;i--){if(i!==numI&&SIZE.test(toks[i])){sizeI=i;break}}}
  if(numI>-1)num=toks[numI];
  if(sizeI>-1)size=toks[sizeI];
  var name=[];
  toks.forEach(function(t,k){if(k!==numI&&k!==sizeI)name.push(t)});
  var n=name.join(' ').replace(EDGE,'').replace(/\s+/g,' ').toLocaleUpperCase('pt-BR');
  size=size.toLocaleUpperCase('pt-BR');
  if(size==='ESPECIAL')size='ESP';
  if(!n&&!num&&!size)return null;
  var f=[n,num,size];
  if(short)f.push(size);
  var out='';
  f.forEach(function(v,k){if(k===0)out+=v;else out+=v?', '+v:','});
  return{text:out,missing:!n||!num||!size};
}
function formatAll(text,short){
  var res=[],miss=0;
  clean(text).split('\n').forEach(function(l){
    var r=formatLine(l,short);
    if(r){res.push(r.text);if(r.missing)miss++}
  });
  return{text:res.join('\n'),count:res.length,miss:miss};
}
/*END*/
function $(i){return document.getElementById(i)}
function run(){
  var r=formatAll($('in').value,$('short').checked);
  $('out').value=r.text;
  $('info').textContent=r.count?(r.count+(r.count===1?' linha':' linhas')+(r.miss?' · '+r.miss+' com campo vazio (vírgula repetida)':'')):'';
}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function copy(){
  run();
  var t=$('out').value;if(!t){toast('Nada para copiar');return}
  function fb(){var a=$('out');a.removeAttribute('readonly');a.focus();a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.setAttribute('readonly','');toast(ok?'Copiado!':'Selecione e copie manualmente')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copiado!')},fb)}else fb();
}
['input','paste','change','keyup'].forEach(function(ev){$('in').addEventListener(ev,function(){setTimeout(run,0)})});
$('short').addEventListener('change',run);
$('fmt').addEventListener('click',run);
$('cp').addEventListener('click',copy);
$('clr').addEventListener('click',function(){$('in').value='';run();$('in').focus()});
run();
</script>
</body>
</html>
