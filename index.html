<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala dos Designers Alpha · Formatador de Lista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave+Display&family=Permanent+Marker&display=swap">
<style>
:root{--bg:#ecebe6;--surface:rgba(255,255,255,.8);--line:rgba(0,0,0,.14);--txt:#15171a;--mute:#5b616a;--field:#fbfaf6;
--y:#ffd400;--red:#e62429;--blue:#1d4ed8;--m:#ff2e88;--c:#00b8d9;--g:#2fd37a;--shadow:0 12px 32px rgba(20,20,30,.16);
--hand:"Permanent Marker","Marker Felt","Comic Sans MS",Impact,sans-serif;--ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0f;--surface:rgba(26,28,34,.8);--line:rgba(255,255,255,.12);--txt:#f2f3f5;--mute:#9ba1ab;--field:#0f1115;--shadow:0 14px 36px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b0c0f;--surface:rgba(26,28,34,.8);--line:rgba(255,255,255,.12);--txt:#f2f3f5;--mute:#9ba1ab;--field:#0f1115;--shadow:0 14px 36px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font:16px/1.55 var(--ui);background-color:var(--bg);min-height:100%;
background-image:radial-gradient(900px 520px at 6% -6%,rgba(230,36,41,.24),transparent 62%),radial-gradient(900px 600px at 100% 100%,rgba(29,78,216,.28),transparent 62%),radial-gradient(560px 380px at 88% 8%,rgba(162,75,255,.15),transparent 62%),
repeating-linear-gradient(0deg,transparent 0 46px,rgba(128,128,128,.075) 46px 47px),repeating-linear-gradient(90deg,transparent 0 94px,rgba(128,128,128,.06) 94px 95px);
background-size:150% 150%,150% 150%,150% 150%,auto,auto;animation:wall 18s ease-in-out infinite alternate}
@keyframes wall{to{background-position:25% 15%,75% 85%,55% 40%,0 0,0 0}}
.wrap{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:18px 18px 56px}

/* fundo temático */
.web{position:fixed;z-index:0;width:min(34vw,240px);color:var(--red);opacity:.22;pointer-events:none}
.w1{top:0;left:0}.w2{bottom:0;right:0;transform:scale(-1,-1);color:var(--blue)}
.swing{position:fixed;z-index:0;top:0;right:9%;transform-origin:top center;animation:swing 3.6s ease-in-out infinite alternate;pointer-events:none}
.swing i{display:block;width:1.5px;height:clamp(80px,14vh,130px);background:var(--txt);opacity:.4;margin:0 auto}
.swing span{display:block;font-size:30px;line-height:1;margin-top:-4px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.fi{position:fixed;z-index:0;opacity:.16;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-34px) rotate(calc(var(--r)*-1))}}

/* logo grafite */
.logo{text-align:center;margin:0 0 6px;user-select:none}
.art{width:100%;max-width:600px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45));overflow:visible;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg) translateY(0)}to{transform:rotate(.8deg) translateY(-5px)}}
.art text{font-family:"Sedgwick Ave Display","Permanent Marker","Brush Script MT",Impact,sans-serif}
.dp{transform-box:fill-box;transform-origin:top;animation:dr 3s ease-in-out infinite}
@keyframes dr{50%{transform:scaleY(1.4)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.35) rotate(25deg);opacity:.6}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.shk{transform-box:fill-box;transform-origin:50% 100%;animation:shk 1.1s ease-in-out infinite}
@keyframes shk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}

/* assinatura */
.brand{position:relative;display:inline-block;max-width:100%;margin-top:14px;padding:14px 26px 16px;border-radius:18px;border:2px solid transparent;
background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(110deg,var(--red),var(--y),var(--blue),var(--m),var(--red)) border-box;background-size:100% 100%,300% 100%;
backdrop-filter:blur(10px);box-shadow:var(--shadow),0 0 40px rgba(230,36,41,.18);animation:bb 6s linear infinite}
@keyframes bb{to{background-position:0 0,300% 0}}
.ttl{font-family:"Sedgwick Ave Display","Permanent Marker",Impact,sans-serif;font-size:clamp(1.5rem,6vw,2.9rem);line-height:1.1;letter-spacing:.03em;text-align:center}
.wd{display:inline-block;white-space:nowrap}
.ttl .lt{display:inline-block;color:var(--y);-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000,4px 4px 0 var(--red);
animation:wave 1.7s ease-in-out infinite,hue 5s linear infinite;animation-delay:calc(var(--i)*.09s),calc(var(--i)*-.25s)}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(2deg) scale(1.06)}}
@keyframes hue{0%,100%{color:#ffd400}33%{color:#ff4a4a}66%{color:#5b9bff}}
.by{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.bytxt{font-family:var(--hand);font-size:1.05rem;color:#fff;background:var(--red);border-radius:8px;padding:0 10px;transform:rotate(-3deg);box-shadow:0 4px 10px rgba(230,36,41,.5)}
.nm{position:relative;display:inline-block;padding:0 4px 12px}
.nmt{display:inline-block;font-family:"Sedgwick Ave Display","Permanent Marker",Impact,sans-serif;font-size:clamp(1.8rem,7.4vw,3.4rem);line-height:1.05;white-space:nowrap;color:transparent;
background:linear-gradient(100deg,#00e5ff 0%,#fff 25%,#ff2e88 50%,#ffd400 75%,#00e5ff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000) drop-shadow(4px 4px 0 var(--red));
animation:shine 3s linear infinite,pop 2.4s ease-in-out infinite alternate}
@keyframes shine{to{background-position:250% 0}}
@keyframes pop{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.05) rotate(1deg)}}
.und{position:absolute;left:0;bottom:0;width:100%;height:14px;overflow:visible;filter:drop-shadow(1px 2px 0 #000)}
.und path{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 2.6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:340}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-340}}
.spk{position:absolute;font-style:normal;color:#ffd400;text-shadow:1px 2px 0 #000;animation:spk 1.4s ease-in-out infinite}
.k1{left:-14px;top:-6px;font-size:20px}.k2{right:-12px;top:6px;font-size:26px;animation-delay:-.5s}.k3{right:30%;top:-16px;font-size:16px;animation-delay:-1s}
@keyframes spk{0%,100%{transform:scale(.4) rotate(0);opacity:.4}50%{transform:scale(1.35) rotate(90deg);opacity:1}}
.sp1{font-size:1.7rem;display:inline-block;animation:bob2 1.8s ease-in-out infinite}.sw2{animation-delay:-.9s}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-7px) rotate(12deg)}}
.divider{display:block;width:100%;height:30px;margin:14px 0 8px;overflow:visible}

/* barra de controles */
.bar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:0 0 18px;padding:12px 16px;
background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.lab{font-family:var(--hand);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:8px}
.seg{display:inline-flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;padding:7px 13px;border-radius:9px;font-family:var(--hand);font-size:.88rem;color:var(--mute);transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap}
.seg input:checked+span{background:linear-gradient(135deg,var(--red),var(--m));color:#fff;box-shadow:0 4px 12px rgba(230,36,41,.45)}
.seg input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.tg{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--hand);font-size:.9rem}
.tg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .2s}
.tg input:checked+.sw{background:linear-gradient(90deg,var(--blue),var(--c))}
.tg input:checked+.sw::after{transform:translateX(17px)}
.tg input:focus-visible+.sw{outline:2px solid var(--m);outline-offset:2px}
.sp{flex:1}
button{font-family:var(--hand);font-size:.95rem;letter-spacing:.03em;border:1px solid var(--line);background:var(--field);color:var(--txt);border-radius:12px;padding:9px 18px;cursor:pointer;transition:transform .12s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.28);filter:brightness(1.06)}
button:active{transform:translateY(0) scale(.97);box-shadow:none}
button.q{background:linear-gradient(135deg,var(--c),var(--blue));color:#fff;border-color:transparent}
button.p{background:linear-gradient(135deg,var(--red),var(--m));color:#fff;border-color:transparent;animation:pul 2.6s ease-in-out infinite}
@keyframes pul{50%{box-shadow:0 0 22px 2px rgba(255,46,136,.55)}}

/* cartões */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:20px;right:20px;top:0;height:3px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--red),var(--y),var(--blue))}
h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--hand);font-weight:400;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--txt)}
h2::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--y);box-shadow:0 0 10px var(--y)}
.grid .card:nth-child(2) h2::before{background:var(--g);box-shadow:0 0 10px var(--g)}
textarea{width:100%;height:340px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--field);color:var(--txt);font:14.5px/1.7 ui-monospace,"Cascadia Code",Consolas,monospace;transition:border-color .15s,box-shadow .15s}
#out{border-color:rgba(47,211,122,.45)}
textarea:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px rgba(0,184,217,.25)}
button:focus-visible{outline:3px solid var(--m);outline-offset:2px}
.info{font-size:.88rem;color:var(--mute);margin-top:10px;min-height:1.4em}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:#111318;color:#fff;font-family:var(--hand);padding:11px 20px;border-radius:12px;border-left:4px solid var(--g);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg class="divider" viewBox="0 0 800 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="dvg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e62429"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
<path d="M0 8C100 2 200 14 300 8S500 2 600 9 740 12 800 6" fill="none" stroke="url(#dvg)" stroke-width="7" stroke-linecap="round"/>
<g fill="url(#dvg)"><rect class="dp" x="70" y="9" width="5" height="22" rx="2.5"/><rect class="dp" style="animation-delay:-.8s" x="210" y="10" width="5" height="14" rx="2.5"/><rect class="dp" style="animation-delay:-1.6s" x="330" y="8" width="5" height="26" rx="2.5"/><rect class="dp" style="animation-delay:-.4s" x="480" y="6" width="5" height="16" rx="2.5"/><rect class="dp" style="animation-delay:-1.2s" x="610" y="9" width="5" height="24" rx="2.5"/><rect class="dp" style="animation-delay:-2s" x="730" y="9" width="5" height="15" rx="2.5"/></g></svg>
<div class="bar">
<span class="lab">Short</span>
<div class="seg" role="radiogroup" aria-label="Short">
<label><input type="radio" name="sh" value="0" checked><span>Não</span></label>
<label><input type="radio" name="sh" value="1"><span>Igual</span></label>
<label><input type="radio" name="sh" value="2"><span>Camisa ≠ Short</span></label>
</div>
<label class="tg"><input type="checkbox" id="sort"><span class="sw"></span>A–Z</label>
<label class="tg"><input type="checkbox" id="dup"><span class="sw"></span>Sem repetidos</label>
<span class="sp"></span>
<button class="q" id="fmt">Formatar</button>
<button id="clr">Limpar</button>
<button class="p" id="cp">Copiar</button>
</div>
<div class="grid">
<div class="card"><h2>Cole a lista</h2><textarea id="in" spellcheck="false" placeholder="joão 10 G&#10;maria (M) #12&#10;gustavo N:7 TM: 8 anos"></textarea></div>
<div class="card"><h2>Resultado</h2><textarea id="out" readonly spellcheck="false"></textarea><div class="info" id="info"></div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
/*CORE*/
var SIZE=/^(BL(?:XXG|XGG|EXGG|EXG|GGG|GG|XG|PP|G|M|P)|A\d{1,2}|ESPECIAL|ESP|XXXG|XXG|XG|EXGG|EXG|XGG|GGGG|GGG|GG|G|M|P|PP|XXS|XS|S|L|XL|XXL|XXXL|G1|G2|G3|G4|EGG|EG|XP)$/i;
var BLRE=/(^|[^\p{L}\p{N}])(?:BABY[\s\-_.]*LOOKS?|BL)(?![\p{L}\p{N}])/giu;
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length]}
var GABBR={FEM:'F',FEMI:'F',FEMIN:'F',MASC:'M',MASCU:'M',MASCUL:'M',UNISEX:'U'};
var GTARGET=[['FEMININO','F'],['FEMININA','F'],['MASCULINO','M'],['MASCULINA','M'],['UNISSEX','U']];
function genderOf(w){
  var t=noAcc(w).toUpperCase().replace(/[^A-Z]/g,'');
  if(!t)return '';
  if(GABBR[t])return GABBR[t];
  if(t.length<7)return '';
  for(var i=0;i<GTARGET.length;i++){if(lev(t,GTARGET[i][0])<=2)return GTARGET[i][1]}
  return '';
}
function stripGender(s){return s.replace(/\p{L}+\.?/gu,function(w){return genderOf(w)?' ':w})}
var WORDS={PEQUENO:'P',MEDIO:'M',GRANDE:'G'};
var SIZE_LAB=/(^|[^\p{L}\p{N}])(?:TAMANHO|TAM|TMH|TM|SIZE)\.?\s*[:=]?\s*(?:([\p{L}\p{N}]{1,8})(?![\p{L}\p{N}])(?!\s*[:=]))?/giu;
var NUM_LAB=/(^|[^\p{L}\p{N}])(?:(?:NUMERO|NÚMERO|NUM|NRO|NR|N)\.?\s*[:=]|N[º°]\.?|NUM(?:ERO)?\.?|NÚMERO)\s*(\d{1,4})?(?![\p{L}\p{N}])/giu;
var NOISE=/(^|[^\p{L}\p{N}])(NOME|CAMISAS?|CAMISETAS?|CONJUNTO|CONJ|COMPLETO)(\d{1,2})?\.?(?![\p{L}\p{N}])\s*[:=]?/giu;
var CAMGLUE=/(^|[^\p{L}\p{N}])CAMISAS?(?=(?:A\d{1,2}|XXXG|XXG|XGG|EXGG|EXG|XG|GGG|GG|G|M|P|PP)(?![\p{L}\p{N}]))/giu;
var SHORT_LAB=/(^|[^\p{L}\p{N}])(?:SHORT(?:S(?=\s))?|BERMUDAS?|CAL[ÇC][ÃA]O)\.?\s*[:=\-–]?\s*(?:(?:TAMANHO|TAM)\.?\s*[:=\-–]?\s*)?(?:([\p{L}\p{N}]{1,8})(?![\p{L}\p{N}]))?/giu;
var EDGE=/^[\s\-–—\/,;:|.'!?]+|[\s\-–—\/,;:|'!?]+$/g;
function clean(s){
  return String(s).normalize('NFC')
    .replace(/[\u200B-\u200D\u2060\uFEFF\u00AD\uFE0F\u20E3]/g,'')
    .replace(/[\u00A0\u2007\u202F]/g,' ')
    .replace(/\r/g,'');
}
function noAcc(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').normalize('NFC')}
function asSize(v){
  v=String(v).trim();
  if(SIZE.test(v))return v.toLocaleUpperCase('pt-BR');
  return WORDS[noAcc(v).toUpperCase()]||'';
}
function dropStray(s){
  var st=[],bad={},i,c;
  for(i=0;i<s.length;i++){c=s[i];
    if(c==='('||c==='[')st.push(i);
    else if(c===')'||c===']'){
      if(st.length&&((s[st[st.length-1]]==='(')===(c===')')))st.pop();else bad[i]=1;
    }
  }
  st.forEach(function(k){bad[k]=1});
  var o='';for(i=0;i<s.length;i++)o+=bad[i]?' ':s[i];
  return o;
}
function formatLine(raw,short,forceBL){
  var mode=(short===2)?2:(short?1:0);
  var line=clean(raw).replace(/°/g,'º').replace(/(^|[^\p{L}\p{N}])\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AaPp]\.?[Mm]\.?)?(?![\p{L}\p{N}])/gu,'$1 ');
  // limpeza: emojis, símbolos, aspas, pontuação decorativa
  line=line.replace(/[\p{Extended_Pictographic}\p{So}\p{Sc}]/gu,' ')
    .replace(/[“”"`´‘’«»{}<>\\^=*~_]/g,' ')
    .replace(/\.{2,}|…|[-–—]{2,}/g,' ')
    .replace(/(^|[^\p{L}])'+|'+(?![\p{L}])/gu,'$1 ');
  line=line.replace(/^[\s•·▪►>\-–—]+/,'').replace(/^\d{1,3}\s*[.)]\s+/,'');
  line=line.replace(/(\p{L})-(\d)/gu,'$1 $2').replace(/(\d)-(\p{L})/gu,'$1 $2');
  line=stripGender(line);
  var bl=!!forceBL,sawCamisa=false,sawConj=false,sawShort=false,shortSize='',glued=[];
  line=line.replace(BLRE,function(m,pre){bl=true;return pre+' '});
  line=line.replace(CAMGLUE,function(m,pre){sawCamisa=true;return pre+' '});
  line=line.replace(NOISE,function(m,pre,kw,d){
    var K=kw.toUpperCase();
    if(K.indexOf('CAMISA')===0)sawCamisa=true;else if(K.indexOf('CONJ')===0||K==='COMPLETO')sawConj=true;
    if(d)glued.push(d);
    return pre+' ';
  });
  // idade: "4 anos", "8anos", "6a" -> A4, A8, A6
  line=line.replace(/(^|[^\p{L}\p{N}])(\d{1,2})\s*anos?(?![\p{L}\p{N}])/giu,'$1A$2 ');
  line=line.replace(/(^|[^\p{L}\p{N}])(\d{1,2})a(?![\p{L}\p{N}])/giu,'$1A$2 ');
  var num='',size='';
  line=line.replace(/#\s*(\d{1,4})(?!\d)/g,function(m,d){if(!num)num=d;return ' ';});
  line=line.replace(/[(\[]\s*([^()\[\]]*?)\s*[)\]]/g,function(m,c){
    var z=SIZE.test(c)?asSize(c):'';
    if(z)return ' '+z+' ';
    if(/^\d{1,3}$/.test(c))return ' '+c+' ';
    return m;
  });
  line=dropStray(line);
  if(mode===2){
    line=line.replace(SHORT_LAB,function(m,pre,val){
      sawShort=true;
      var z=val?asSize(val):'';
      if(z){if(!shortSize)shortSize=z;return pre+' '}
      if(val&&/^\d{1,2}$/.test(val)){if(!shortSize)shortSize='A'+val;return pre+' '}
      return pre+' '+(val||'')+' ';
    });
  }
  line=line.replace(SIZE_LAB,function(m,pre,val){
    var z=val?asSize(val):'';
    if(z){if(!size)size=z;return pre+' ';}
    if(val&&/^\d{1,2}$/.test(val)){if(!size)size='A'+val;return pre+' ';}
    return pre+' '+(val||'')+' ';
  });
  line=line.replace(NUM_LAB,function(m,pre,d){if(d&&!num)num=d;return pre+' ';});
  var toks=line.split(/[\s,;|\/:=]+/).map(function(t){
    return t.replace(/^[.,;:'~\-_\]\[\/\\!?]+|[.,;:'~\-_\]\[\/\\!?]+$/g,'').replace(/^(\d{1,3})[º°]$/,'$1');
  }).filter(Boolean);
  if(mode===2&&(sawShort||sawCamisa||sawConj))toks=toks.filter(function(t){return !/^(E|&|\+|COM)$/i.test(t)});
  var numI=-1,sizeI=-1,shortI=-1,i;
  if(!num){for(i=0;i<toks.length;i++){if(/^\d{1,3}$/.test(toks[i])){numI=i;break}}}
  if(!size){
    var sz=[];
    for(i=0;i<toks.length;i++){if(i!==numI&&SIZE.test(toks[i]))sz.push(i)}
    if(mode===2&&sz.length>=2&&!shortSize){sizeI=sz[0];shortI=sz[1]}
    else if(sz.length)sizeI=sz[sz.length-1];
  }
  if(numI>-1)num=toks[numI];
  if(sizeI>-1)size=toks[sizeI];
  if(shortI>-1)shortSize=toks[shortI];
  if(!num&&glued.length)num=glued[0];
  var name=[];
  toks.forEach(function(t,k){if(k!==numI&&k!==sizeI&&k!==shortI)name.push(t)});
  if(!size){
    for(i=0;i<name.length;i++){
      var pm=name[i].match(/^[(\[]([\p{L}]+)[)\]]$/u);
      if(pm&&WORDS[noAcc(pm[1]).toUpperCase()]){size=WORDS[noAcc(pm[1]).toUpperCase()];name.splice(i,1);break}
    }
  }
  var n=name.join(' ').replace(/[()\[\]]/g,' ').replace(/(\p{L}{2,})\.(?=\s|$)/gu,'$1').replace(/^\(+([^()]*)\)+$/,'$1').replace(EDGE,'').replace(/\s+/g,' ').toLocaleUpperCase('pt-BR');
  size=size.toLocaleUpperCase('pt-BR');
  shortSize=shortSize.toLocaleUpperCase('pt-BR');
  if(mode===2){
    if(!size&&shortSize&&(sawCamisa||sawConj))size=shortSize;
    if(size&&!shortSize&&(sawShort||sawConj||!sawCamisa))shortSize=size;
  }
  if(size==='ESPECIAL')size='ESP';
  if(shortSize==='ESPECIAL')shortSize='ESP';
  if(bl&&!/^BL/.test(size))size='BL'+size;
  if(!n&&!num&&!size&&!shortSize)return null;
  var f=[n,num,size];
  if(mode===1)f.push(size);
  if(mode===2)f.push(shortSize);
  var out='';
  f.forEach(function(v,k){if(k===0)out+=v;else out+=v?', '+v:','});
  return{text:out,name:n,missing:!n||!num||!size||(mode===2&&!shortSize)};
}
function headerKind(raw){
  var t=clean(raw).replace(/[\p{Extended_Pictographic}\p{So}\p{Sc}]/gu,' ').replace(/[^\p{L}\p{N}\s]/gu,' ');
  var hasBL=false,masc=false,any=false;
  t=t.replace(BLRE,function(){hasBL=true;return ' '});
  t=t.replace(/\p{L}+/gu,function(w){var g=genderOf(w);if(!g)return w;any=true;if(g!=='F')masc=true;return ' '});
  if(t.replace(/\s+/g,'')!=='')return '';
  if(hasBL)return 'bl';
  if(masc)return 'reset';
  return any?'none':'';
}
function formatAll(text,short,opt){
  opt=opt||{};
  var rows=[],seen={},miss=0,secBL=false;
  clean(text).split('\n').forEach(function(l){
    var h=headerKind(l);
    if(h){if(h==='bl')secBL=true;else if(h==='reset')secBL=false;return}
    var r=formatLine(l,short,secBL);
    if(!r)return;
    if(opt.dup){if(seen[r.text])return;seen[r.text]=1}
    rows.push(r);
  });
  if(opt.sort){
    rows=rows.map(function(r,i){r.i=i;return r}).sort(function(a,b){
      if(!a.name!==!b.name)return a.name?-1:1;
      return a.name.localeCompare(b.name,'pt-BR')||a.i-b.i;
    });
  }
  rows.forEach(function(r){if(r.missing)miss++});
  return{text:rows.map(function(r){return r.text}).join('\n'),count:rows.length,miss:miss};
}
/*END*/
function $(i){return document.getElementById(i)}
var userSet=false,autoSet=false;
function mode(){var r=document.querySelector('input[name=sh]:checked');return r?Number(r.value):0}
function setMode(v){var r=document.querySelector('input[name=sh][value="'+v+'"]');if(r)r.checked=true}
function run(){
  var txt=$('in').value,hasShort=/(^|[^\p{L}\p{N}])(SHORT|BERMUDA|CAL[ÇC][ÃA]O)/iu.test(txt);
  if(!userSet){
    if(hasShort&&mode()!==2){setMode(2);autoSet=true}
    else if(!hasShort&&autoSet){setMode(0);autoSet=false}
  }
  var r=formatAll(txt,mode(),{sort:$('sort').checked,dup:$('dup').checked});
  $('out').value=r.text;
  $('info').textContent=r.count?(r.count+(r.count===1?' linha':' linhas')+(r.miss?' · '+r.miss+' com campo vazio (vírgula repetida)':'')+(autoSet?' · detectei SHORT: camisa e short separados':'')):'';
}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2200)}
function copy(){
  run();
  var t=$('out').value;if(!t){toast('Nada para copiar');return}
  function fb(){var a=$('out');a.removeAttribute('readonly');a.focus();a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.setAttribute('readonly','');toast(ok?'Copiado!':'Selecione e copie manualmente')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copiado!')},fb)}else fb();
}
['input','paste','change','keyup'].forEach(function(ev){$('in').addEventListener(ev,function(){setTimeout(run,0)})});
['sort','dup'].forEach(function(i){$(i).addEventListener('change',run)});
Array.prototype.forEach.call(document.querySelectorAll('input[name=sh]'),function(r){r.addEventListener('change',function(){userSet=true;autoSet=false;run()})});
$('fmt').addEventListener('click',run);
$('cp').addEventListener('click',copy);
$('clr').addEventListener('click',function(){$('in').value='';run();$('in').focus()});

/* ---- ícones flutuantes ---- */
(function(){
  var ic=['🕷️','🕸️','🎨','🕷️','👕','🕸️','✂️','🕷️','🕸️','📏','🕷️','🧵','🕸️','🕷️','⚡','🕸️','👟','🕷️','🕸️','🛹'],fx=$('fx');
  ic.forEach(function(e,i){
    var s=document.createElement('span');s.className='fi';s.textContent=e;
    s.style.left=((i*37+9)%94)+'%';s.style.top=((i*53+6)%90)+'%';
    s.style.fontSize=(24+(i*13)%30)+'px';
    s.style.setProperty('--d',(7+(i%6)*1.7)+'s');s.style.setProperty('--dl',(-i*1.3)+'s');
    s.style.setProperty('--r',((i%2?1:-1)*(10+(i%4)*9))+'deg');
    fx.appendChild(s);
  });
})();
/* ---- respingo de tinta nos cliques ---- */
document.addEventListener('click',function(ev){
  if(!ev.target.closest||!ev.target.closest('button'))return;
  var cols=['#e62429','#ffd900','#1d4ed8','#ff2e88','#ffffff'];
  for(var i=0;i<12;i++){
    var d=document.createElement('i'),a=i*30*Math.PI/180,k=40+(i%3)*22;
    d.style.cssText='position:fixed;z-index:9;pointer-events:none;border-radius:50%;border:2px solid #000;left:'+ev.clientX+'px;top:'+ev.clientY+'px;width:'+(8+i%3*4)+'px;height:'+(8+i%3*4)+'px;background:'+cols[i%5];
    document.body.appendChild(d);
    (function(d,a,k){
      if(d.animate){var an=d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*k+'px,'+Math.sin(a)*k+'px) scale(.3)',opacity:0}],{duration:560,easing:'ease-out'});an.onfinish=function(){d.remove()}}
      else d.remove();
    })(d,a,k);
  }
});

(function(){
  var el=document.querySelector('.wv');if(!el)return;
  var t=el.getAttribute('data-t'),i=0;
  t.split(' ').forEach(function(w,k){
    var wd=document.createElement('span');wd.className='wd';
    Array.prototype.forEach.call(w,function(ch){var l=document.createElement('span');l.className='lt';l.textContent=ch;l.style.setProperty('--i',i++);wd.appendChild(l)});
    if(k)el.appendChild(document.createTextNode(' '));
    el.appendChild(wd);
  });
})();
run();
</script>
